name: User story
description: Une fonctionnalité décrite du point de vue de l'utilisateur
title: "[Story] "
labels: ["type:story"]
body:
  - type: textarea
    id: histoire
    attributes:
      label: Histoire
      description: "Format : En tant que …, je veux …, afin de …"
    validations:
      required: true
  - type: textarea
    id: criteres
    attributes:
      label: Critères d'acceptation
      description: "Un scénario par ligne (de 3 à 7), au format : Étant donné … / Quand … / Alors …"
    validations:
      required: true
  - type: textarea
    id: hors-perimetre
    attributes:
      label: Hors périmètre
      description: Ce que cette histoire ne couvre pas.
  - type: checkboxes
    id: invest
    attributes:
      label: Contrôle INVEST
      description: Une histoire trop grosse se découpe en tranches plus petites.
      options:
        - label: Indépendante des autres histoires
        - label: Négociable
        - label: Apporte une valeur à l'utilisateur
        - label: Estimable
        - label: Assez petite pour être finie en une tranche
        - label: Testable grâce aux critères ci-dessus
