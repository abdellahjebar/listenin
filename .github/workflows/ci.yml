name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      # Binaire MongoDB des tests (mongodb-memory-server) gardé hors de node_modules, mis en cache.
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Mettre en cache le binaire MongoDB des tests
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/package.json') }}
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - name: Vérifier le contrat OpenAPI
        run: npm run api:lint
      - name: Vérifier que les types de l'API sont à jour
        run: |
          npm run api:types
          if [ -n "$(git status --porcelain -- src/api)" ]; then
            echo "::error::Types de l'API périmés : lancer « npm run api:types » dans backend/ et commiter le résultat."
            git diff -- src/api
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Vérifier que les types de l'API sont à jour
        run: |
          npm run api:types
          if [ -n "$(git status --porcelain -- src/app/core/api)" ]; then
            echo "::error::Types de l'API périmés : lancer « npm run api:types » dans frontend/ et commiter le résultat."
            git diff -- src/app/core/api
            exit 1
          fi
      - run: npm run format:check
      - run: npm run lint
      - run: npm test -- --watch=false
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  docker:
    name: Images Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Construire l'image du backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Construire l'image du frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  compose:
    name: Démarrage (compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lancer MongoDB, l'API et l'application
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Vérifier le parcours de bout en bout
        run: |
          set -euo pipefail
          base=http://localhost:8080
          # Réponse lue en entier avant d'être vérifiée : « curl | grep -q » échoue au hasard
          # avec pipefail (grep s'arrête tôt, curl reçoit SIGPIPE).
          health=$(curl --fail --silent "$base/api/health")
          [[ "$health" == *'"status":"ok"'* ]]
          page=$(curl --fail --silent "$base/inscription")
          [[ "$page" == *'<app-root'* ]]
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'Origin: http://localhost:8080' --header 'Content-Type: application/json' \
            --data '{"name":"CI","email":"ci@example.com","password":"une phrase de passe assez longue","acceptTerms":true}' \
            "$base/api/accounts")
          test "$status" = 201
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'Origin: http://localhost:8080' --header 'Content-Type: application/json' \
            --data '{"email":"ci@example.com","password":"une phrase de passe assez longue"}' \
            "$base/api/sessions")
          test "$status" = 201
          echo "Santé, application, inscription et connexion : OK"
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs --no-color
      - name: Arrêter
        if: always()
        run: docker compose down --volumes
