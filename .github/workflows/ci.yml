name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      # Binaire MongoDB des tests (mongodb-memory-server) gardé hors de node_modules, mis en cache.
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Mettre en cache le binaire MongoDB des tests
        uses: actions/cache@v5
        with:
          path: .cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/package.json') }}
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - name: Vérifier le contrat OpenAPI
        run: npm run api:lint
      - name: Vérifier que les types de l'API sont à jour
        run: |
          npm run api:types
          if [ -n "$(git status --porcelain -- src/api)" ]; then
            echo "::error::Types de l'API périmés : lancer « npm run api:types » dans backend/ et commiter le résultat."
            git diff -- src/api
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Vérifier que les types de l'API sont à jour
        run: |
          npm run api:types
          if [ -n "$(git status --porcelain -- src/app/core/api)" ]; then
            echo "::error::Types de l'API périmés : lancer « npm run api:types » dans frontend/ et commiter le résultat."
            git diff -- src/app/core/api
            exit 1
          fi
      - run: npm run format:check
      - run: npm run lint
      - run: npm test -- --watch=false
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  docker:
    name: Images Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Construire l'image du backend
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Construire l'image du frontend
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
