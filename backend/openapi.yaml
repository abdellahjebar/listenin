openapi: 3.1.0
info:
  title: API ListenIn
  version: 0.1.0
  summary: Réseau professionnel pour musiciens.
  description: |
    Contrat de l'API de ListenIn, écrit avant le code (ADR 0003 et 0007).
    L'API valide chaque requête par rapport à ce document ; les tests valident aussi les réponses.

    Toute erreur suit le même format : `{ "error": { "code", "message", "details" } }`.
  license:
    name: Propriétaire
    identifier: LicenseRef-Proprietary
servers:
  - url: /api
    description: Même origine que l'application web
tags:
  - name: Identité
    description: Comptes et sessions.
  - name: Exploitation
    description: Surveillance du service.
security: []
paths:
  /accounts:
    post:
      tags: [Identité]
      operationId: createAccount
      summary: S'inscrire
      description: |
        Crée un compte et son profil, enregistre l'acceptation des conditions d'utilisation,
        puis ouvre une session : le membre est connecté (story 1).

        Requête refusée si son en-tête `Origin` n'est pas celui de ListenIn (403), et au-delà
        de 10 inscriptions par heure depuis la même adresse IP (429).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAccount'
      responses:
        '201':
          description: Compte créé ; la réponse pose le cookie de session.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '409':
          description: Adresse e-mail déjà utilisée (code `EmailAlreadyUsed`). Risque accepté (ADR 0006).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /sessions:
    post:
      tags: [Identité]
      operationId: createSession
      summary: Se connecter
      description: |
        Ouvre une nouvelle session et supprime celle que le navigateur avait peut-être déjà
        (contre la fixation de session). Une adresse inconnue et un mauvais mot de passe
        reçoivent exactement la même réponse 401 (F4).

        Limites : 5 échecs en 15 minutes par adresse IP et adresse e-mail, 100 tentatives en
        15 minutes par adresse IP ; au-delà, 429.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '201':
          description: Connecté ; la réponse pose un nouveau cookie de session.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Adresse e-mail ou mot de passe incorrect (code `InvalidCredentials`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /sessions/current:
    get:
      tags: [Identité]
      operationId: getCurrentSession
      summary: Voir le membre connecté
      description: Sert à l'application web pour savoir si le navigateur a une session active.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Le membre connecté.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Identité]
      operationId: deleteCurrentSession
      summary: Se déconnecter
      description: |
        Détruit la session côté serveur et efface le cookie. Répond 204 même sans session
        valide : l'opération peut être répétée sans risque.
      responses:
        '204':
          description: Déconnecté.
          headers:
            Set-Cookie:
              description: Efface le cookie `__Host-session`.
              schema:
                type: string
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '500':
          $ref: '#/components/responses/InternalError'
  /health:
    get:
      tags: [Exploitation]
      operationId: getHealth
      summary: Vérifier que l'API répond
      description: Utilisée par la surveillance et par le contrôle de santé de l'image Docker.
      responses:
        '200':
          description: L'API répond.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    sessionCookie:
      description: |
        Session côté serveur (ADR 0006). Le numéro est posé par l'API dans un cookie `HttpOnly` :
        l'application web ne le manipule jamais, le navigateur l'envoie seul.
      type: apiKey
      in: cookie
      name: __Host-session
  headers:
    SessionCookie:
      description: |
        `__Host-session=…; Path=/; HttpOnly; Secure; SameSite=Strict`. Le numéro de session
        n'est lisible par aucun script de la page (SEC-4).
      schema:
        type: string
  schemas:
    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          writeOnly: true
    NewAccount:
      type: object
      additionalProperties: false
      required: [name, email, password, acceptTerms]
      properties:
        name:
          description: Nom affiché sur le profil.
          type: string
          minLength: 1
          maxLength: 100
          pattern: \S
        email:
          type: string
          format: email
          maxLength: 254
        password:
          description: |
            15 caractères au minimum, 128 au maximum, sans règle de composition
            (NIST SP 800-63B-4, ADR 0006).
          type: string
          format: password
          minLength: 15
          maxLength: 128
          writeOnly: true
        acceptTerms:
          description: Acceptation des conditions d'utilisation ; seule la valeur `true` est admise.
          type: boolean
          const: true
    Account:
      type: object
      additionalProperties: false
      required: [id, name, email]
      properties:
        id:
          type: string
          pattern: ^[0-9a-f]{24}$
        name:
          type: string
        email:
          description: Enregistrée en minuscules.
          type: string
          format: email
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Error:
      description: Format commun à toutes les erreurs (conventions REST de Microsoft).
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              description: Code stable, lisible par un programme.
              type: string
              examples: [ValidationError]
            message:
              description: Message lisible par une personne.
              type: string
            details:
              description: Une entrée par champ en cause.
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [target, message]
      properties:
        target:
          description: Le champ en cause, par exemple `email`.
          type: string
        message:
          type: string
  responses:
    ValidationError:
      description: La requête ne respecte pas le contrat (code `ValidationError` ou `InvalidJson`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: Connexion requise ou session expirée (code `Unauthenticated`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ForbiddenOrigin:
      description: En-tête `Origin` absent ou étranger à ListenIn (code `ForbiddenOrigin`, SEC-10).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Trop de tentatives (code `TooManyRequests`, SEC-5).
      headers:
        Retry-After:
          description: Nombre de secondes à attendre.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Erreur interne du serveur.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
